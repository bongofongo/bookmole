# The salted rows. No layer yet exposes a salted-rows-only selection, so this
# recipe applies the layers that carry salts in full; refusing verbs are marked
# `"expect": "fail"` in the verb file itself, and the runner records every
# case's outcome in the semantic lock's `hostile` list.
name = "hostile"
description = "Every layer that carries hostile salts, with refusals declared as expected failures."

[[step]]
kind = "goodreads-import"
csv = "corpus/generated/reader/physical.csv"

[[step]]
kind = "ko-sync"
root = "corpus/generated/modern"

[[step]]
kind = "verbs"
file = "corpus/generated/reader/verbs.jsonl"

# Observed 2026-10-20: `progress <book> -- -12` exits 0 and stores
# current_page = -12. hostile.json declares page-negative `rejected`; the
# declaration stands and the divergence is reported as an engine bug.
[[known]]
case = "page-negative"
why = "progress accepts and stores a negative page (engine bug)"
