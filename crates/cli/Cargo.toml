[package]
name = "bookmole-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MPL-2.0"

[[bin]]
name = "bookmole"
path = "src/main.rs"

[dependencies]
bookmole = { path = "../engine" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
rpassword.workspace = true
# Reading dates are unix seconds on the wire; the CLI is where they become a
# date a person reads. Already a workspace dependency — no version to pick.
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# The $EDITOR draft, and the subprocess tests' sandbox. Already a dependency of
# the engine, so no new crate enters the tree.
tempfile = "3"

[lints]
workspace = true
