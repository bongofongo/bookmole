name: CI

on:
  push:
    branches: [main]
    # `paths-ignore`, deliberately, rather than a `paths` allowlist: with branch
    # protection an allowlist leaves required checks stuck "pending" forever on
    # a docs-only PR, which is then unmergeable for no reason.
    # Duplicated below rather than shared via a YAML anchor — the Actions
    # workflow parser does not support anchors/aliases.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "perf/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "perf/**"
      - ".gitignore"

# No DATABASE_URL anywhere below, and that is correct — this crate uses runtime
# `sqlx::query()` only (zero `query!` macros, no `.sqlx/`), and the
# `sqlx::migrate!` in storage/mod.rs is a compile-time *file* read. Nothing here
# needs a database. Please don't helpfully add one.
#
# No toolchain action either: the runners ship rustup, which reads
# rust-toolchain.toml and installs the pinned version plus its components on the
# first cargo call. Adding a setup action would just fight the pin.

# Read-only unless a job says otherwise; none here writes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --all --check

      # --all-targets subsumes `cargo check`, so there is no separate build job.
      # And it covers the *whole workspace*, not just the engine: an engine-only
      # gate that lets a change to `SearchOutcome` break the CLI is not a gate.
      # `-D warnings` lives here rather than in RUSTFLAGS — as an env var it
      # would invalidate the cache against every local build.
      #
      # `--locked` on both: Cargo.lock is committed, and a lockfile once picked
      # up a breaking change in a patch release (the old `epub` crate, since
      # replaced; `lopdf` is pinned exactly for the same reason). Without
      # --locked nothing detects that recurring.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Not redundant with the line above, and the difference is the point.
      # `--all-targets` resolves dev-dependencies, and `crates/tui`'s switch on
      # the engine's `internals` feature — the door left open so test fixtures
      # can reach `Engine::storage()` while frontends go through the engine's
      # public methods and `bookmole-api`. Under clippy that door is open
      # for the shipped binaries too. This is the build where it is shut, so a
      # frontend that reopens the seam in production code fails here and only
      # here.
      - run: cargo check --workspace --locked

  test:
    name: tests — ${{ matrix.scope }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Asymmetric on purpose.
        #
        # ubuntu runs the WHOLE workspace. The TUI's suite used to be out of
        # scope here, on the argument that the engine is what this gates — but
        # that only held while every TUI change was written and run by hand on
        # the dev machine. It no longer is, and the suite contains
        # `every_screen_draws_at_every_size`, which is the one thing standing
        # between a layout bug and a panic in the user's tmux pane. It is
        # headless (ratatui TestBackend), so it needs nothing a runner lacks.
        #
        # macOS stays engine-only. It earns its slot for the two C dependencies
        # that build differently there (vendored lua54, libsqlite3-sys), not for
        # layout arithmetic — running the ray tracer twice buys nothing. Free
        # here because the repo is public; on a private repo these bill at 10x
        # and should move to the scheduled workflow instead.
        include:
          - os: ubuntu-26.04
            scope: whole workspace
            args: --workspace
          - os: macos-latest
            scope: engine
            args: -p bookmole
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest

      # --profile ci: no fail-fast (the whole picture in one pass, same reason
      # as elsewhere in this file), explicit zero retries so a flaky test is
      # reported rather than quietly re-run clean, and a junit.xml artifact for
      # whatever wants to read one later. .config/nextest.toml also sets a
      # slow-timeout on the default profile — a hung test must not hang this
      # job for its full 30-minute budget.
      - run: cargo nextest run ${{ matrix.args }} --locked --profile ci

  migrations:
    name: migrations are append-only
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff needs the merge base, which the default shallow clone
          # does not have.
          fetch-depth: 0

      # "Never edit an applied migration" as a check rather than a convention.
      # sqlx records a checksum of every migration it has applied, so editing
      # one in place breaks every database that already ran it — with an error
      # that names the checksum and not the cause. Parallel branches are what
      # make this worth mechanising: the rule is easy to keep on one branch and
      # easy to forget across several.
      #
      # M, D and R alike: a migration that is modified, deleted, or renamed is a
      # migration whose recorded checksum no longer describes it.
      - name: refuse a modified, deleted or renamed migration
        run: |
          # `*.sql` only, not the whole directory. What sqlx checksums is the
          # migration files; anything else kept beside them (notes about
          # writing a migration, say) is not an applied migration, and without
          # the glob this gate would fail any PR that edits such a file.
          #
          # The exclusions, listed in .github/amended-migrations.txt, are the
          # migrations whose comments were amended after they shipped (`AMENDED`
          # in crates/engine/src/storage/mod.rs repairs the recorded checksum).
          # They are not open to edit: that table pins each file's current
          # checksum and a test fails on any further change.
          mapfile -t skip < <(grep -v '^#' .github/amended-migrations.txt | sed 's/^/:!/')
          changed=$(git diff --diff-filter=MDR --name-only \
            "${{ github.event.pull_request.base.sha }}...HEAD" \
            -- 'crates/engine/migrations/*.sql' "${skip[@]}")
          if [ -n "$changed" ]; then
            echo "::error::an applied migration was changed, not added:"
            echo "$changed"
            echo
            echo "Add a new numbered migration instead; never edit an applied one."
            exit 1
          fi
          echo "migrations are append-only in this PR."

  deny:
    name: cargo-deny
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bans + licenses + sources only. `advisories` is on the scheduled
      # workflow instead: the advisory DB moves independently of this repo, so
      # running it here would red PRs for a reason their author cannot fix.
      # On the runner rather than through EmbarkStudios/cargo-deny-action, whose
      # Alpine container lacks the pinned toolchain and printed an `error:`
      # line on every run — scheduled.yml's advisories job carries the detail.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - run: cargo deny check bans licenses sources
