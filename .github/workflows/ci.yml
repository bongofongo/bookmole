name: CI

on:
  push:
    branches: [main]
    # A docs-only push to main skips CI. Pull requests take no path filter at
    # all: a filter that skips the workflow leaves its required checks
    # "pending" forever, and the pull request can never merge.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "perf/**"
      - ".gitignore"
  pull_request:

# No DATABASE_URL anywhere below, and that is correct — this crate uses runtime
# `sqlx::query()` only (zero `query!` macros, no `.sqlx/`), and the
# `sqlx::migrate!` in storage/mod.rs is a compile-time *file* read. Nothing here
# needs a database. Please don't helpfully add one.
#
# No toolchain action either: the runners ship rustup, which reads
# rust-toolchain.toml and installs the pinned version plus its components on the
# first cargo call. Adding a setup action would just fight the pin.

# Read-only unless a job says otherwise; none here writes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A gate target whose tool is missing fails here instead of printing SKIPPED.
  BOOKMOLE_REQUIRE_TOOLS: "1"

# Every check is a Makefile target, so `make ci` locally runs these same commands.

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: make fmt-check
      - run: make lint
      # Not redundant with lint: see the Makefile's build-check.
      - run: make build-check

  # ubuntu runs the WHOLE workspace. The TUI's suite used to be out of scope
  # here, on the argument that the engine is what this gates — but that only
  # held while every TUI change was written and run by hand on the dev machine.
  # It no longer is, and the suite contains `every_screen_draws_at_every_size`,
  # which is the one thing standing between a layout bug and a panic in the
  # user's tmux pane. It is headless (ratatui TestBackend), so it needs nothing
  # a runner lacks.
  #
  # The engine's macOS leg runs nightly in scheduled.yml instead of here: it is
  # there for the two C dependencies that build differently on macOS, which
  # change rarely, and macOS runners are often slow enough to start that
  # waiting on one held up every pull request.
  test:
    name: tests — whole workspace (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest

      - run: make test NEXTEST_PROFILE=ci

  migrations:
    name: migrations are append-only
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff needs the merge base, which the default shallow clone
          # does not have.
          fetch-depth: 0

      - name: refuse a modified, deleted or renamed migration
        run: make migrations-check
        env:
          MIGRATIONS_BASE: ${{ github.event.pull_request.base.sha }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bans + licenses + sources only. `advisories` is on the scheduled
      # workflow instead: the advisory DB moves independently of this repo, so
      # running it here would red PRs for a reason their author cannot fix.
      # On the runner rather than through EmbarkStudios/cargo-deny-action, whose
      # Alpine container lacks the pinned toolchain and printed an `error:`
      # line on every run — scheduled.yml's advisories job carries the detail.
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny
      - run: make deny
