name: Fuzz

# Never on PRs. This needs a nightly toolchain and runs for a fixed wall-clock
# time, neither of which belongs in a gate someone is waiting on.
#
# PR-time protection comes from `crates/engine/tests/fuzz_seeds.rs` instead: it
# replays the committed seed corpus on stable in milliseconds. Anything this job
# finds gets minimized into fuzz/seeds/ and is guarded there from then on.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        default: "300"

env:
  CARGO_TERM_COLOR: always

# Read-only unless a job says otherwise; none here writes.
permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [parse_sidecar, epub_info]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain has no version tags, only branches named for
      # toolchains, so it is pinned at master and told the toolchain outright.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11-13
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      # The explicit `tool:` form, not the `@cargo-fuzz` tool-name tag. That tag
      # stopped resolving — the action ran, reported "no tool specified", and
      # installed nothing, so every run since died on `no such command: fuzz`
      # after paying for a nightly toolchain and a cache restore.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz

      # `--target x86_64-unknown-linux-gnu` is not decoration. cargo-fuzz
      # defaults to the triple it was *itself* compiled for, and the prebuilt
      # binary install-action fetches is musl-linked — so it tried to build the
      # fuzz targets for musl, a target the nightly toolchain here does not have
      # std for, and died on "can't find crate for `core`". Name the host triple
      # and the default never applies.
      #
      # `-timeout=10` is load-bearing for parse_sidecar: it is how a
      # non-terminating Lua chunk is detected at all. Without it a runaway loop
      # reads as a slow input rather than a hang.
      # `-s none` — no AddressSanitizer, and that is measured rather than
      # cargo-culted. mlua's vendored Lua propagates errors with longjmp, which
      # ASAN's interceptors do not survive here: with ASAN the target pinned a
      # core and made no progress at all, while without it parse_sidecar managed
      # 741k execs in 26s and epub_info 110k. libFuzzer's coverage guidance,
      # panic detection and -timeout hang detection all still work; what is lost
      # is memory-error detection inside the C dependencies. Revisit if the
      # interaction is ever fixed upstream.
      - name: Fuzz ${{ matrix.target }}
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '300' }}
        # The first directory is libFuzzer's writable corpus; the seeds after it
        # are only read, so a run never adds files to the committed set.
        run: |
          mkdir -p fuzz/corpus/"${{ matrix.target }}"
          cargo fuzz run -s none --target x86_64-unknown-linux-gnu "${{ matrix.target }}" \
            -- -max_total_time="$SECONDS_PER_TARGET" \
               -timeout=10 \
               -rss_limit_mb=2048 \
               fuzz/corpus/"${{ matrix.target }}" \
               fuzz/seeds/"${{ matrix.target }}"

      # Any crash is a file under fuzz/artifacts/. Keep it: it is the input that
      # becomes the next committed seed.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
