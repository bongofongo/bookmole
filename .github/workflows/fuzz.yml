name: Fuzz

# Never on PRs. This needs a nightly toolchain and runs for a fixed wall-clock
# time, neither of which belongs in a gate someone is waiting on.
#
# PR-time protection comes from `crates/engine/tests/fuzz_seeds.rs` instead: it
# replays the committed seed corpus on stable in milliseconds. Anything this job
# finds gets minimized into fuzz/seeds/ and is guarded there from then on.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        default: "300"

env:
  CARGO_TERM_COLOR: always
  BOOKMOLE_REQUIRE_TOOLS: "1"

# Read-only unless a job says otherwise; none here writes.
permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [parse_sidecar, epub_info]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain has no version tags, only branches named for
      # toolchains, so it is pinned at master and told the toolchain outright.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11-13
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      # The explicit `tool:` form, not the `@cargo-fuzz` tool-name tag. That tag
      # stopped resolving — the action ran, reported "no tool specified", and
      # installed nothing, so every run since died on `no such command: fuzz`
      # after paying for a nightly toolchain and a cache restore.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz

      # The flags, and why each is there, are the Makefile's `fuzz` target.
      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ github.event.inputs.seconds || '300' }}
        run: make fuzz

      # Any crash is a file under fuzz/artifacts/. Keep it: it is the input that
      # becomes the next committed seed.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
